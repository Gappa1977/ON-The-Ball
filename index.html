<script>
  // Storage collegato al Google Sheet condiviso, tramite Apps Script.
  // URL fisso: nessuna configurazione richiesta a chi apre la pagina.
  const apiUrl = "https://script.google.com/macros/s/AKfycbw4NT3qTAoLXytaXr-XhDDyAtOjEp-vgHWkg_4lSD9godiqqPEOYujo-lLkq_qmdq51RA/exec";

  // --- Retry automatico + avviso visibile in caso di salvataggio fallito ---
  async function fetchWithRetry(url, options, maxAttempts) {
    maxAttempts = maxAttempts || 3;
    for (let attempt = 1; attempt <= maxAttempts; attempt++) {
      try {
        const res = await fetch(url, options);
        if (res && res.ok) return res;
      } catch (e) {
        console.warn("Tentativo " + attempt + " fallito:", e);
      }
      if (attempt < maxAttempts) {
        await new Promise((r) => setTimeout(r, 500 * attempt));
      }
    }
    return null;
  }

  // Punto 5 (Vers. 2.2): niente più banner a piena larghezza per ogni singolo salvataggio fallito
  // (fetchWithRetry ha già ritentato 3 volte in automatico prima di arrivare qui). Un piccolo
  // indicatore in basso a destra, cliccabile, con un pulsante "Riprova tutto" che rilancia
  // esattamente le stesse operazioni fallite.
  // Fix 05/09/2026: prima la coda viveva SOLO in memoria (un array con dentro una funzione di
  // retry), quindi un ricaricamento della pagina la cancellava senza nessun avviso — un salvataggio
  // fallito spariva per sempre, senza lasciare traccia in nessun backup. Ora la coda si salva in
  // localStorage (sopravvive al reload) e la pagina avvisa prima di chiudersi/ricaricarsi se ci
  // sono modifiche in sospeso.
  const FAILED_SAVES_KEY = "cimianoTracker_failedSaves_v1";
  function leggiFailedSavesSalvati() {
    try {
      const raw = localStorage.getItem(FAILED_SAVES_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }
  function scriviFailedSavesSalvati(lista) {
    try {
      // Si salva solo ciò che serve per ripetere l'azione (action/sheet/match/valori), non la
      // funzione retryFn: le funzioni non sono serializzabili in JSON e non sopravvivrebbero comunque
      // a un reload, che ricrea da zero l'intero script.
      localStorage.setItem(FAILED_SAVES_KEY, JSON.stringify(lista.map((f) => ({ id: f.id, sheet: f.sheet, action: f.action, match: f.match || null, valori: f.valori || null }))));
    } catch (e) { /* storage pieno o non disponibile: peggio per la persistenza, non blocca l'app */ }
  }
  function eseguiAzioneSalvataggio(f) {
    if (f.action === "insert") return window.rows.insert(f.sheet, f.valori);
    if (f.action === "upsert") return window.rows.upsert(f.sheet, f.match, f.valori);
    if (f.action === "delete") return window.rows.remove(f.sheet, f.match);
    return Promise.resolve(null);
  }
  function registerFailedSave(sheet, action, match, valori) {
    window.__failedSaves.push({ id: Date.now() + Math.random(), sheet: sheet, action: action, match: match || null, valori: valori || null });
    scriviFailedSavesSalvati(window.__failedSaves);
    renderSaveErrorIndicator();
  }
  // Recupera eventuali salvataggi rimasti in sospeso da PRIMA di questo caricamento (es. la pagina
  // era stata ricaricata con l'indicatore rosso ancora acceso): l'utente li vede e può ritentarli
  // subito, invece che perderli senza saperlo.
  window.__failedSaves = leggiFailedSavesSalvati();
  if (document.body) { renderSaveErrorIndicator(); } else { document.addEventListener("DOMContentLoaded", renderSaveErrorIndicator); }
  window.addEventListener("beforeunload", function (e) {
    if (window.__failedSaves.length > 0) {
      e.preventDefault();
      e.returnValue = "";
      return "";
    }
  });
  function renderSaveErrorIndicator() {
    let el = document.getElementById("save-error-indicator");
    const n = window.__failedSaves.length;
    if (n === 0) {
      if (el) el.remove();
      const panel = document.getElementById("save-error-panel");
      if (panel) panel.remove();
      try { localStorage.removeItem(FAILED_SAVES_KEY); } catch (e) {}
      return;
    }
    if (!el) {
      el = document.createElement("div");
      el.id = "save-error-indicator";
      el.style.cssText = "position:fixed;bottom:16px;right:16px;z-index:9999;background:#c8102e;color:#fff;padding:8px 14px;border-radius:20px;font-family:system-ui,sans-serif;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.3);";
      el.onclick = toggleSaveErrorPanel;
      document.body.appendChild(el);
    }
    el.textContent = "⚠️ " + n + (n === 1 ? " modifica non salvata" : " modifiche non salvate");
  }
  function toggleSaveErrorPanel() {
    const esistente = document.getElementById("save-error-panel");
    if (esistente) { esistente.remove(); return; }
    const panel = document.createElement("div");
    panel.id = "save-error-panel";
    panel.style.cssText = "position:fixed;bottom:60px;right:16px;z-index:9999;background:#fff;border:2px solid #c8102e;border-radius:8px;padding:12px;max-width:280px;font-family:system-ui,sans-serif;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,0.3);";
    const lista = window.__failedSaves.map(function (f) { return "• " + f.sheet; }).join("<br/>");
    panel.innerHTML = "<div style=\"font-weight:700;margin-bottom:6px;color:#c8102e;\">Modifiche non salvate</div>" +
      "<div style=\"margin-bottom:10px;color:#333;\">" + lista + "</div>" +
      "<button id=\"retry-all-saves-btn\" style=\"background:#c8102e;color:#fff;border:none;padding:6px 12px;border-radius:4px;cursor:pointer;font-weight:600;width:100%;\">Riprova tutto</button>";
    document.body.appendChild(panel);
    document.getElementById("retry-all-saves-btn").onclick = retryAllFailedSaves;
  }
  async function retryAllFailedSaves() {
    const daRiprovare = window.__failedSaves.slice();
    window.__failedSaves = [];
    scriviFailedSavesSalvati(window.__failedSaves);
    renderSaveErrorIndicator();
    for (const f of daRiprovare) {
      const risultato = await eseguiAzioneSalvataggio(f);
      // Se anche questo ritentativo fallisce, eseguiAzioneSalvataggio richiama internamente
      // window.rows.*, che a sua volta rimette in coda da sola (vedi sotto): niente da fare qui.
    }
  }

  // Punto 1 (Vers. 2.2): data di oggi VERA (fuso orario del dispositivo), non più congelata.
  function todayISO() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }

  // Fase 3: banner dedicato per un fallimento nel CARICAMENTO iniziale di Rosa/Amichevoli/Risultati
  // (diverso dal fallimento di un salvataggio): qui l'unica azione sensata è ricaricare la pagina,
  // MAI inventare dati di default al posto di quelli veri che non siamo riusciti a leggere.
  function showLoadError() {
    let banner = document.getElementById("load-error-banner");
    if (banner) return;
    banner = document.createElement("div");
    banner.id = "load-error-banner";
    banner.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:9999;background:#7a1e1e;color:#fff;padding:10px 16px;font-size:13px;text-align:center;";
    banner.innerHTML = "⚠️ Non sono riuscito a caricare Rosa/Amichevoli/Risultati (problema di connessione). Per sicurezza non ho mostrato dati inventati. <button id=\"load-error-retry\" style=\"margin-left:8px;padding:4px 12px;border-radius:4px;border:none;background:#fff;color:#7a1e1e;font-weight:700;cursor:pointer;\">Ricarica</button>";
    document.body.appendChild(banner);
    document.getElementById("load-error-retry").onclick = function () { window.location.reload(); };
  }

  // --- Fase 3 completa: comunicazione con tutti i fogli "a righe" (Rosa, Amichevoli, RisultatiUfficiali,
  // Voti, Marcatori, VotoSquadra, Convocati, Formazioni, Moduli, Impostazioni, CalendarioCampionato,
  // CalendarioCoppa). window.storage (il vecchio blob chiave-valore) è stato tolto: era già morto,
  // nessuna parte del Tracker lo chiamava più. ---
  // 0R (14/09/2026): "chi" da allegare ad ogni salvataggio per il foglio "Log" — inizializzato
  // subito dalla localStorage (stessa chiave già usata per l'identità di chi vota), così è
  // disponibile anche per salvataggi che avvengono prima che il componente React abbia fatto il
  // suo primo giro (l'effect più sotto lo tiene poi allineato ad ogni cambio).
  try {
    const vnIniziale = window.localStorage.getItem("girone-a-voter-name");
    window.__chiCorrente = vnIniziale ? JSON.parse(vnIniziale) : "";
  } catch (e) { window.__chiCorrente = ""; }

  window.rows = {
    // Punto 3 (Vers. 2.2): UNA SOLA richiesta di rete per tutti i 12 fogli, invece di 12 separate.
    // Vale solo per il caricamento iniziale (i singoli salvataggi restano mirati al foglio giusto).
    listAll: async function () {
      const res = await fetchWithRetry(apiUrl + "?action=listAll", {}, 3);
      if (!res) return null;
      try {
        const data = await res.json();
        if (data && data.ok && data.sheets) return data.sheets;
        return null;
      } catch (e) {
        return null;
      }
    },
    list: async function (sheet) {
      const res = await fetchWithRetry(apiUrl + "?action=list&sheet=" + encodeURIComponent(sheet), {}, 3);
      // null = richiesta fallita (non sappiamo se il foglio è vuoto o no: NON dedurre nulla).
      // [] = richiesta riuscita e il foglio è davvero vuoto.
      if (!res) return null;
      try {
        const data = await res.json();
        if (data && data.ok && Array.isArray(data.rows)) return data.rows;
        return null;
      } catch (e) {
        return null;
      }
    },
    insert: async function (sheet, valori) {
      const res = await fetchWithRetry(apiUrl, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "insert", sheet: sheet, valori: valori, chi: window.__chiCorrente || "" }),
      }, 3);
      if (!res) { registerFailedSave(sheet, "insert", null, valori); return null; }
      try {
        const data = await res.json();
        if (data && data.ok) return data.row;
        registerFailedSave(sheet, "insert", null, valori);
        return null;
      } catch (e) {
        return null;
      }
    },
    upsert: async function (sheet, match, valori) {
      const res = await fetchWithRetry(apiUrl, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "upsert", sheet: sheet, match: match, valori: valori, chi: window.__chiCorrente || "" }),
      }, 3);
      if (!res) { registerFailedSave(sheet, "upsert", match, valori); return null; }
      try {
        const data = await res.json();
        if (data && data.ok) return data.row;
        registerFailedSave(sheet, "upsert", match, valori);
        return null;
      } catch (e) {
        return null;
      }
    },
    remove: async function (sheet, match) {
      const res = await fetchWithRetry(apiUrl, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "delete", sheet: sheet, match: match, chi: window.__chiCorrente || "" }),
      }, 3);
      if (!res) { registerFailedSave(sheet, "delete", match, null); return false; }
      try {
        const data = await res.json();
        if (!data || !data.ok) registerFailedSave(sheet, "delete", match, null);
        return !!(data && data.ok);
      } catch (e) {
        return false;
      }
    },
    // Foto giocatore (06/09/2026): niente coda di salvataggi falliti qui, il payload (immagine in
    // base64) è troppo grande per starci comodamente in localStorage insieme al resto. In caso di
    // errore ritorna null e chi chiama mostra un messaggio, l'utente riprova manualmente scegliendo
    // di nuovo il file.
    uploadFoto: async function (playerId, base64, mimeType) {
      const res = await fetchWithRetry(apiUrl, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "uploadFoto", playerId: playerId, base64: base64, mimeType: mimeType }),
      }, 2);
      if (!res) return null;
      try {
        const data = await res.json();
        return (data && data.ok) ? data.url : null;
      } catch (e) {
        return null;
      }
    },
  };
</script>

        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');
        .body-font { font-family: 'Quicksand', sans-serif; font-weight: 500; }
        .title-font { font-family: 'Quicksand', sans-serif; font-weight: 700; }
        .mono-font { font-family: 'JetBrains Mono', monospace; }
        .chrome-box { padding: 3px; border-radius: 16px; background: ${CHROME_BORDER}; box-shadow: 0 14px 26px -10px rgba(0,0,0,0.55); }
        .chrome-box-inner { border-radius: 13px; background: ${PANEL_BG}; }
        /* 0.23 (15/09/2026): griglia della riga partita (Stagione/Campionato/Coppa/Amichevoli) con
           aree nominate, così la versione da cellulare (sotto) può spostare i bottoni su una terza
           riga a piena larghezza senza toccare il markup, solo la disposizione delle aree. */
        .riga-partita-grid { display: grid; grid-template-columns: 22px 170px auto 1fr; column-gap: 8px; row-gap: 3px; align-items: center;
          grid-template-areas: "plus homeName homeScore meta" "plus awayName awayScore buttons"; }
        .riga-partita-grid .area-plus { grid-area: plus; }
        .riga-partita-grid .area-home-name { grid-area: homeName; }
        .riga-partita-grid .area-home-score { grid-area: homeScore; }
        .riga-partita-grid .area-meta { grid-area: meta; }
        .riga-partita-grid .area-away-name { grid-area: awayName; }
        .riga-partita-grid .area-away-score { grid-area: awayScore; }
        .riga-partita-grid .area-buttons { grid-area: buttons; }
        @media (max-width: 480px) {
          .riga-partita-grid { grid-template-columns: 22px 130px auto;
            grid-template-areas: "meta meta meta" "plus homeName homeScore" "plus awayName awayScore" "buttons buttons buttons"; }
          .riga-partita-grid .area-meta { text-align: left !important; justify-self: start !important; margin-bottom: 2px; }
          .riga-partita-grid .area-buttons { justify-self: stretch !important; justify-content: flex-end; margin-top: 2px; }
        }
        .plus-btn { box-sizing: border-box; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer; border: 1.5px solid; }
        .plus-shape { position: relative; width: 10px; height: 10px; flex-shrink: 0; }
        .plus-shape::before { content: ""; position: absolute; background: currentColor; width: 10px; height: 2px; top: 4px; left: 0; }
        .plus-shape::after { content: ""; position: absolute; background: currentColor; width: 2px; height: 10px; top: 0; left: 4px; }
        .plus-open .plus-shape::after { display: none; }
        table { border-collapse: collapse; width: 100%; }
        th, td { padding: 8px 10px; text-align: left; }
        tbody tr { border-bottom: 1px solid ${LINE}; }
        input, textarea { font-family: 'Quicksand', sans-serif; background: ${PANEL_BG}; color: ${INK}; border: 2px solid ${accentUI}; }
        select { font-family: 'Quicksand', sans-serif; background: ${PANEL_BG}; color: ${INK}; border: 1px solid ${LINE}; }
        ::placeholder { color: ${MUTED}; opacity: 1; }
        .score-input { width: 40px; padding: 5px; border: 1px solid ${LINE}; text-align: center; border-radius: 8px; box-sizing: border-box; }
        .btn-solid { background: ${accentUI}; color: #fff; border: none; padding: 5px 12px; border-radius: 8px; font-weight: 600; font-size: 11px; cursor: pointer; font-family: 'Quicksand', sans-serif; }
        .btn-ghost { background: linear-gradient(${CREAM}, ${CREAM}) padding-box, linear-gradient(90deg, ${LINE}, ${accentUI}) border-box; color: ${accentUI}; border: 1.5px solid transparent; padding: 4px 11px; border-radius: 8px; font-weight: 600; font-size: 11px; cursor: pointer; font-family: 'Quicksand', sans-serif; }
        .btn-ghost-muted { background: transparent; color: ${MUTED}; border: 1px solid ${LINE}; padding: 4px 11px; border-radius: 8px; font-weight: 600; font-size: 11px; cursor: pointer; font-family: 'Quicksand', sans-serif; }
        .classifica-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .classifica-row { min-width: 420px; }
        .classifica-row > span:not(:last-child) { border-right: 1px solid ${LINE}; }
        .dual-pitch-wrapper { display: flex; flex-direction: column; gap: 20px; }
        @media (min-width: 700px) {
          .dual-pitch-wrapper { flex-direction: row; gap: 14px; }
        }
        /* Formazione v2 (08/09/2026): da cellulare, Titolari e Panchina affiancati sopra, Mappa sotto
           a piena larghezza — le tre colonne fianco a fianco diventavano imbarazzanti su schermo stretto. */
        .formazione-grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-areas: "tit panch" "mappa mappa"; gap: 10px 8px; align-items: start; }
        @media (min-width: 700px) {
          .formazione-grid { grid-template-columns: auto 1fr auto; grid-template-areas: "tit mappa panch"; align-items: start; }
        }
        @media print {
          body * { visibility: hidden; }
          .distinta-print, .distinta-print * { visibility: visible; }
          .distinta-print { position: fixed; top: 0; left: 0; width: 100% !important; max-width: 100% !important; max-height: none !important; overflow: visible !important; box-shadow: none !important; }
          .no-print { display: none !important; }
        }
